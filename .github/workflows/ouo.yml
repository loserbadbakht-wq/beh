name: input
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      ouo_url:
        description: 'ouo link'
        required: true
        type: string
jobs:
  build:
    name: Run

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Run bypass script
      env:
        OUO_URL: ${{ inputs.ouo_url }}
      run: python ./bypass.py

    - name: Show result
      run: cat output.txt
