name: Download iFunny Tag Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'iFunny tag to scrape (without #)'
        required: false
        default: 'trap'
      max_images:
        description: 'Max images to download'
        required: false
        default: '500'
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

concurrency:
  group: ifunny-download
  cancel-in-progress: false

jobs:
  download-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Ensure Git LFS tracks *.zip
        run: |
          git lfs install --local
          if ! grep -qF '*.zip' .gitattributes 2>/dev/null; then
            git lfs track "*.zip"
            git add .gitattributes
            git -c user.name="github-actions[bot]" \
                -c user.email="github-actions[bot]@users.noreply.github.com" \
                commit -m "chore: track *.zip with Git LFS"
          fi

      - name: Scrape tag via JSON feed and build archive
        env:
          TAG_NAME: ${{ github.event.inputs.tag || 'trap' }}
          MAX_IMAGES: ${{ github.event.inputs.max_images || '500' }}
          OUTPUT_ZIP: ifunny_tag_images.zip
          TEMP_DIR: temp_images
          ALLOWED_EXT: jpg,jpeg,png,webp
          MAX_PAGES: '120'
        run: |
          cat > scrape.py <<'PY'
          import os, sys, time, shutil, zipfile
          import requests

          TAG_NAME   = os.environ.get('TAG_NAME', 'trap')
          MAX_IMAGES = int(os.environ.get('MAX_IMAGES', '500'))
          OUTPUT_ZIP = os.environ.get('OUTPUT_ZIP', 'ifunny_tag_images.zip')
          TEMP_DIR   = os.environ.get('TEMP_DIR', 'temp_images')
          MAX_PAGES  = int(os.environ.get('MAX_PAGES', '120'))
          ALLOWED    = [e.strip().lower() for e in
                        os.environ.get('ALLOWED_EXT', 'jpg,jpeg,png,webp').split(',') if e.strip()]

          BASE = f'https://ifunny.co/api/v1/feeds/tags/{TAG_NAME}'

          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 '
                            '(KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Accept': 'application/json',
              'Accept-Language': 'en-US,en;q=0.9',
              'Referer': f'https://ifunny.co/tags/{TAG_NAME}',
          }

          def fetch_feed(next_cursor=None):
              params = {'filter': 'all'}
              if next_cursor:
                  params['next'] = next_cursor
              r = requests.get(BASE, headers=HEADERS, params=params, timeout=30)
              r.raise_for_status()
              return r.json()

          def extract_media(item):
              # Prefer the direct media URL; fall back to the pic object
              for key in ('url', 'pic.webp_url', 'pic.url'):
                  val = item
                  for part in key.split('.'):
                      val = val.get(part) if isinstance(val, dict) else None
                      if val is None:
                          break
                  if isinstance(val, str) and val.lower().rsplit('.', 1)[-1] in ALLOWED:
                      return val
              return None

          def download(url, dest, attempts=3):
              for n in range(1, attempts + 1):
                  try:
                      with requests.get(url, headers=HEADERS, stream=True, timeout=30) as resp:
                          resp.raise_for_status()
                          with open(dest, 'wb') as f:
                              for chunk in resp.iter_content(16384):
                                  f.write(chunk)
                      return True
                  except Exception as e:
                      if n == attempts:
                          print(f'    gave up: {e}')
                          return False
                      time.sleep(2 * n)

          def main():
              os.makedirs(TEMP_DIR, exist_ok=True)
              urls, seen = [], set()
              cursor = None

              for page in range(1, MAX_PAGES + 1):
                  if len(urls) >= MAX_IMAGES:
                      break
                  try:
                      data = fetch_feed(cursor)
                  except Exception as e:
                      print(f'page {page}: feed fetch failed: {e}')
                      break

                  items = data.get('items') or []
                  new_urls = []
                  for item in items:
                      u = extract_media(item)
                      if u and u not in seen:
                          seen.add(u)
                          new_urls.append(u)

                  print(f'page {page}: {len(items)} items, {len(new_urls)} new media '
                        f'(total {len(urls) + len(new_urls)})')

                  if not new_urls:
                      print('no new media -> stopping pagination')
                      break

                  urls.extend(new_urls)
                  cursor = (data.get('pagination') or {}).get('next')
                  if not cursor:
                      print('pagination.next is empty -> end of feed')
                      break
                  time.sleep(1)

              urls = urls[:MAX_IMAGES]
              print(f'\ndownloading {len(urls)} files from "{TAG_NAME}"')

              ok = 0
              for i, u in enumerate(urls, 1):
                  ext = u.rsplit('.', 1)[-1].lower()
                  dest = os.path.join(TEMP_DIR, f'media_{i:04d}.{ext}')
                  if download(u, dest):
                      ok += 1
                  if i % 25 == 0:
                      print(f'  {i}/{len(urls)} processed ({ok} ok)')

              print(f'downloaded {ok}/{len(urls)}')

              if ok == 0:
                  print('nothing downloaded; no archive written')
                  shutil.rmtree(TEMP_DIR, ignore_errors=True)
                  return 0

              print(f'writing {OUTPUT_ZIP}')
              with zipfile.ZipFile(OUTPUT_ZIP, 'w', zipfile.ZIP_DEFLATED) as z:
                  for root, _, files in os.walk(TEMP_DIR):
                      for name in sorted(files):
                          p = os.path.join(root, name)
                          z.write(p, os.path.relpath(p, TEMP_DIR))

              shutil.rmtree(TEMP_DIR, ignore_errors=True)
              size_mb = os.path.getsize(OUTPUT_ZIP) / (1024 * 1024)
              print(f'done: {OUTPUT_ZIP} ({size_mb:.1f} MB)')
              return 0

          if __name__ == '__main__':
              sys.exit(main())
          PY
          python scrape.py

      - name: Commit and push archive
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f ifunny_tag_images.zip ]; then
            git add ifunny_tag_images.zip
          fi

          if git diff --cached --quiet; then
            echo "No archive changes to commit."
            exit 0
          fi

          git commit -m "chore: update iFunny tag archive $(date -u +'%Y-%m-%d')"
          git push origin "HEAD:${{ github.ref_name }}"
