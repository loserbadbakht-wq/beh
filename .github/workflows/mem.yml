name: Download iFunny Tag Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'iFunny tag (without #)'
        required: false
        default: 'trap'
      max_images:
        description: 'Max images to download'
        required: false
        default: '500'

permissions:
  contents: write

concurrency:
  group: ifunny-download
  cancel-in-progress: false

jobs:
  download-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-linux-1

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Ensure Git LFS tracks *.zip
        run: |
          git lfs install --local
          if ! grep -qF '*.zip' .gitattributes 2>/dev/null; then
            git lfs track "*.zip"
            git add .gitattributes
            git -c user.name="github-actions[bot]" \
                -c user.email="github-actions[bot]@users.noreply.github.com" \
                commit -m "chore: track *.zip with Git LFS"
          fi

      - name: Scrape tag (headless scroll) and build archive
        env:
          TAG_NAME: ${{ github.event.inputs.tag || 'trap' }}
          MAX_IMAGES: ${{ github.event.inputs.max_images || '500' }}
          OUTPUT_ZIP: ifunny_tag_images.zip
          TEMP_DIR: temp_images
          MAX_SCROLLS: '200'
        run: |
          cat > scrape.py <<'PY'
          import os, re, sys, time, shutil, zipfile
          import requests
          from playwright.sync_api import sync_playwright

          TAG         = os.environ.get('TAG_NAME', 'trap')
          MAX_IMAGES  = int(os.environ.get('MAX_IMAGES', '500'))
          OUTPUT_ZIP  = os.environ.get('OUTPUT_ZIP', 'ifunny_tag_images.zip')
          TEMP_DIR    = os.environ.get('TEMP_DIR', 'temp_images')
          MAX_SCROLLS = int(os.environ.get('MAX_SCROLLS', '200'))
          STALL_LIMIT = 6

          UA = ('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 '
                '(KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36')

          # images only; add |mp4 inside the group to also grab videos
          MEDIA_RE = re.compile(
              r'https://img\.getfn\.io/(?:images|videos)/[a-f0-9]+_\d+\.(?:jpg|jpeg|png|webp)',
              re.IGNORECASE)

          COLLECT_JS = """
          () => {
            const out = [];
            for (const el of document.querySelectorAll('img, video')) {
              for (const attr of ['data-src', 'src']) {
                const v = el.getAttribute(attr);
                if (v && v.startsWith('https://img.getfn.io/')) out.push(v);
              }
            }
            return out;
          }
          """

          def collect(page, seen, ordered):
              added = 0
              for u in page.evaluate(COLLECT_JS):
                  if u in seen or not MEDIA_RE.match(u):
                      continue
                  seen.add(u)
                  ordered.append(u)
                  added += 1
              return added

          def download(url, dest, attempts=3):
              headers = {'User-Agent': UA, 'Referer': 'https://ifunny.co/'}
              for n in range(1, attempts + 1):
                  try:
                      with requests.get(url, headers=headers, stream=True, timeout=30) as r:
                          r.raise_for_status()
                          with open(dest, 'wb') as f:
                              for chunk in r.iter_content(16384):
                                  f.write(chunk)
                      return True
                  except Exception as e:
                      if n == attempts:
                          print('    give up: %s' % e)
                          return False
                      time.sleep(2 * n)

          def main():
              os.makedirs(TEMP_DIR, exist_ok=True)
              seen, ordered, stall = set(), [], 0

              with sync_playwright() as p:
                  browser = p.chromium.launch(args=['--no-sandbox', '--disable-dev-shm-usage'])
                  ctx = browser.new_context(
                      user_agent=UA,
                      viewport={'width': 1280, 'height': 1600},
                      locale='en-US',
                  )
                  page = ctx.new_page()
                  url = 'https://ifunny.co/tags/%s' % TAG
                  print('opening %s' % url)
                  page.goto(url, wait_until='domcontentloaded', timeout=90000)
                  page.wait_for_timeout(4000)

                  for i in range(1, MAX_SCROLLS + 1):
                      added = collect(page, seen, ordered)
                      print('scroll %d: +%d (total %d)' % (i, added, len(ordered)))
                      if len(ordered) >= MAX_IMAGES:
                          print('reached target')
                          break
                      if added == 0:
                          stall += 1
                          if stall >= STALL_LIMIT:
                              print('no new media for %d scrolls; stopping' % STALL_LIMIT)
                              break
                      else:
                          stall = 0
                      page.evaluate('window.scrollTo(0, document.body.scrollHeight)')
                      page.wait_for_timeout(2000)

                  browser.close()

              urls = ordered[:MAX_IMAGES]
              print('\ndownloading %d files from tag "%s"' % (len(urls), TAG))
              ok = 0
              for i, u in enumerate(urls, 1):
                  ext = u.rsplit('.', 1)[-1].lower()
                  dest = os.path.join(TEMP_DIR, 'media_%04d.%s' % (i, ext))
                  if download(u, dest):
                      ok += 1
                  if i % 50 == 0:
                      print('  %d/%d (%d ok)' % (i, len(urls), ok))

              print('downloaded %d/%d' % (ok, len(urls)))
              if ok == 0:
                  print('nothing downloaded; no archive written')
                  shutil.rmtree(TEMP_DIR, ignore_errors=True)
                  return 0

              print('writing %s' % OUTPUT_ZIP)
              with zipfile.ZipFile(OUTPUT_ZIP, 'w', zipfile.ZIP_DEFLATED) as z:
                  for root, _, files in os.walk(TEMP_DIR):
                      for name in sorted(files):
                          fp = os.path.join(root, name)
                          z.write(fp, os.path.relpath(fp, TEMP_DIR))

              shutil.rmtree(TEMP_DIR, ignore_errors=True)
              size = os.path.getsize(OUTPUT_ZIP) / 1048576.0
              print('done: %s (%.1f MB)' % (OUTPUT_ZIP, size))
              return 0

          if __name__ == '__main__':
              sys.exit(main())
          PY
          python scrape.py

      - name: Commit and push archive
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f ifunny_tag_images.zip ]; then
            git add ifunny_tag_images.zip
          fi

          if git diff --cached --quiet; then
            echo "No archive changes to commit."
            exit 0
          fi

          git commit -m "chore: update iFunny tag archive $(date -u +'%Y-%m-%d')"
          git push origin "HEAD:${{ github.ref_name }}"
