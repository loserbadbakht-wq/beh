name: Download and Push File

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Direct file URL (any file; archives are auto-extracted)'
        required: true
        type: string

jobs:
  download-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download file
        id: dl
        env:
          FILE_URL: ${{ inputs.file_url }}
        run: |
          set -euo pipefail

          echo "=== URL ==="
          echo "$FILE_URL"

          # Extract filename from the URL path, ignoring query string
          FILE_NAME=$(echo "$FILE_URL" | sed 's/[?#].*$//' | awk -F'/' '{print $NF}')
          if [ -z "$FILE_NAME" ]; then
            echo "::error::Could not determine filename from URL."
            exit 1
          fi
          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "File will be: $FILE_NAME"

          curl -L --fail --retry 3 --retry-delay 5 \
            -A 'Mozilla/5.0' \
            -o "$FILE_NAME" \
            "$FILE_URL"

          ls -lh "$FILE_NAME"
          file "$FILE_NAME"

          # Detect MIME type using `file --mime-type`
          MIME_TYPE=$(file --mime-type -b "$FILE_NAME")
          echo "mime_type=$MIME_TYPE" >> "$GITHUB_OUTPUT"
          echo "Detected MIME type: $MIME_TYPE"

      - name: Extract archive (if applicable)
        id: extract
        run: |
          set -euo pipefail
          FILE_NAME="${{ steps.dl.outputs.file_name }}"
          MIME_TYPE="${{ steps.dl.outputs.mime_type }}"

          # Determine if the file is an archive we can extract
          IS_ARCHIVE=false
          case "$MIME_TYPE" in
            application/zip|application/x-zip-compressed|application/x-tar|application/gzip|application/x-gzip|application/x-bzip2|application/x-xz|application/x-7z-compressed|application/x-rar|application/x-compressed-tar|application/x-gtar)
              IS_ARCHIVE=true
              ;;
          esac

          # Also detect by extension as a fallback
          if [ "$IS_ARCHIVE" = "false" ]; then
            case "${FILE_NAME,,}" in
              *.zip|*.tar|*.tar.gz|*.tgz|*.tar.bz2|*.tbz2|*.tar.xz|*.txz|*.gz|*.bz2|*.xz|*.7z|*.rar)
                IS_ARCHIVE=true
                ;;
            esac
          fi

          if [ "$IS_ARCHIVE" = "true" ]; then
            FOLDER_NAME="${FILE_NAME%.*}"
            # Strip common double extensions like .tar.gz
            case "${FILE_NAME,,}" in
              *.tar.gz)  FOLDER_NAME="${FILE_NAME%.tar.gz}" ;;
              *.tar.bz2) FOLDER_NAME="${FILE_NAME%.tar.bz2}" ;;
              *.tar.xz)  FOLDER_NAME="${FILE_NAME%.tar.xz}" ;;
            esac
            echo "folder_name=$FOLDER_NAME" >> "$GITHUB_OUTPUT"
            echo "is_archive=true" >> "$GITHUB_OUTPUT"

            mkdir -p "$FOLDER_NAME"

            case "${FILE_NAME,,}" in
              *.zip)
                unzip -o "$FILE_NAME" -d "$FOLDER_NAME"
                ;;
              *.tar.gz|*.tgz)
                tar -xzf "$FILE_NAME" -C "$FOLDER_NAME"
                ;;
              *.tar.bz2|*.tbz2)
                tar -xjf "$FILE_NAME" -C "$FOLDER_NAME"
                ;;
              *.tar.xz|*.txz)
                tar -xJf "$FILE_NAME" -C "$FOLDER_NAME"
                ;;
              *.tar)
                tar -xf "$FILE_NAME" -C "$FOLDER_NAME"
                ;;
              *.gz)
                gunzip -c "$FILE_NAME" > "$FOLDER_NAME/$(basename "${FILE_NAME%.gz}")"
                ;;
              *.bz2)
                bunzip2 -c "$FILE_NAME" > "$FOLDER_NAME/$(basename "${FILE_NAME%.bz2}")"
                ;;
              *.xz)
                unxz -c "$FILE_NAME" > "$FOLDER_NAME/$(basename "${FILE_NAME%.xz}")"
                ;;
              7z|*.7z)
                # try p7zip if available
                if command -v 7z >/dev/null 2>&1; then
                  7z x -o"$FOLDER_NAME" "$FILE_NAME"
                else
                  echo "::warning::7z extraction not available, keeping archive as-is."
                  rm -rf "$FOLDER_NAME"
                  echo "is_archive=false" >> "$GITHUB_OUTPUT"
                  echo "folder_name=" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                ;;
              *)
                # Fallback: attempt unzip, else keep file
                if ! unzip -o "$FILE_NAME" -d "$FOLDER_NAME"; then
                  echo "::warning::Could not extract archive, keeping file as-is."
                  rm -rf "$FOLDER_NAME"
                  echo "is_archive=false" >> "$GITHUB_OUTPUT"
                  echo "folder_name=" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                ;;
            esac

            rm -f "$FILE_NAME"

            echo "=== Extracted contents ==="
            ls -la "$FOLDER_NAME"
          else
            echo "Not an archive; keeping file as-is."
            echo "is_archive=false" >> "$GITHUB_OUTPUT"
            echo "folder_name=" >> "$GITHUB_OUTPUT"
            ls -lh "$FILE_NAME"
          fi

      - name: Commit and push with Git LFS
        run: |
          set -euo pipefail
          FILE_NAME="${{ steps.dl.outputs.file_name }}"
          IS_ARCHIVE="${{ steps.extract.outputs.is_archive }}"
          FOLDER_NAME="${{ steps.extract.outputs.folder_name }}"

          git lfs install

          if [ "$IS_ARCHIVE" = "true" ]; then
            TARGET="$FOLDER_NAME"
            git lfs track "${TARGET}/**"
          else
            TARGET="$FILE_NAME"
            git lfs track "$TARGET"
          fi
          git add .gitattributes

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f "$TARGET"

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "Add ${TARGET}"
          git push
