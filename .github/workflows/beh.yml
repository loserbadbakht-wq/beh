name: Download and Push All Files with Git LFS

on:
  workflow_dispatch:

jobs:
  update-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Only permission needed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Download tarball
        run: |
          curl -L -o package.tgz https://registry.npmjs.org/@videojs/html/-/html-10.0.0-beta.31.tgz

      - name: Extract tarball
        run: |
          mkdir extracted
          tar -xzf package.tgz -C extracted
          if [ -d "extracted/package" ]; then
            mv extracted/package/* extracted/
            rmdir extracted/package
          fi

      - name: Remove .github from extracted (if present)
        run: |
          rm -rf extracted/.github 2>/dev/null || true

      - name: Configure Git LFS to track ALL files (except .gitattributes)
        run: |
          git lfs track "*"
          echo ".gitattributes !filter !diff !merge text" >> .gitattributes
          git add .gitattributes

      - name: Copy extracted files to repo root (exclude .git and .github)
        run: |
          rsync -av --exclude='.git' --exclude='.github' extracted/ ./
          rm -rf extracted package.tgz

      - name: Discard any changes to .github/workflows
        run: |
          # Restore tracked workflow files to their committed state
          git checkout HEAD -- .github/workflows/ 2>/dev/null || true
          # Remove any untracked files under .github/workflows
          git clean -fd .github/workflows/ 2>/dev/null || true

      - name: Stage all changes, then unstage .github/workflows
        run: |
          git add .
          # Explicitly unstage anything under .github/workflows
          git reset HEAD .github/workflows/ 2>/dev/null || true

      - name: Commit and push (workflow files excluded)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Double-check that .github/workflows is not staged
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "ERROR: .github/workflows/ files are still staged!" >&2
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update from @videojs/html v10.0.0-beta.31 [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "No changes to commit."
          fi
