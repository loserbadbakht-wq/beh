name: Download and Push All Files with Git LFS

on:
  workflow_dispatch:

jobs:
  update-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Download tarball
        run: |
          curl -L -o package.tgz https://registry.npmjs.org/@videojs/html/-/html-10.0.0-beta.31.tgz

      - name: Extract tarball
        run: |
          mkdir extracted
          tar -xzf package.tgz -C extracted
          if [ -d "extracted/package" ]; then
            mv extracted/package/* extracted/
            rmdir extracted/package
          fi

      - name: Configure Git LFS to track ALL files (except .gitattributes)
        run: |
          # Track everything with LFS
          git lfs track "*"
          # But .gitattributes itself must stay a normal Git file
          echo ".gitattributes !filter !diff !merge text" >> .gitattributes
          git add .gitattributes

      - name: Copy extracted files to repo root
        run: |
          rsync -av --exclude='.git' extracted/ ./
          rm -rf extracted package.tgz

      - name: Commit and push all changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Update from @videojs/html v10.0.0-beta.31 [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "No changes to commit."
          fi
