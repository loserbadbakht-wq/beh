name: Mirror Video.js CDN

on:
  workflow_dispatch:

jobs:
  mirror-cdn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install @videojs/html@10.0.0-beta.31
        run: npm install --no-save @videojs/html@10.0.0-beta.31

      - name: Copy CDN files to public/videojs
        run: |
          mkdir -p public
          cp -r node_modules/@videojs/html/cdn public/videojs

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'Mirror Video.js CDN files (v10.0.0-beta.31)'
          file_pattern: 'public/**'
