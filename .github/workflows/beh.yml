
name: Download and Push All Files with Git LFS

on:
  workflow_dispatch:

jobs:
  update-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Only permission needed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Download tarball
        run: |
          curl -L -o package.tgz https://registry.npmjs.org/@videojs/html/-/html-10.0.0-beta.31.tgz

      - name: Extract tarball
        run: |
          mkdir extracted
          tar -xzf package.tgz -C extracted
          if [ -d "extracted/package" ]; then
            mv extracted/package/* extracted/
            rmdir extracted/package
          fi

      - name: Remove any .github folder from extracted contents
        run: |
          # Delete .github (if it exists) from the extracted directory
          rm -rf extracted/.github 2>/dev/null || true

      - name: Configure Git LFS to track ALL files (except .gitattributes)
        run: |
          git lfs track "*"
          echo ".gitattributes !filter !diff !merge text" >> .gitattributes
          git add .gitattributes

      - name: Copy extracted files to repo root (excluding .git and .github)
        run: |
          # rsync with explicit excludes (--exclude works for top-level)
          rsync -av --exclude='.git' --exclude='.github' extracted/ ./
          rm -rf extracted package.tgz

      - name: Revert any accidental changes to .github/workflows
        run: |
          # Discard any modifications to tracked workflow files
          git checkout HEAD -- .github/workflows/ 2>/dev/null || true
          # Remove any untracked files/folders under .github/workflows
          git clean -fd .github/workflows/ 2>/dev/null || true

      - name: Commit and push all changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Update from @videojs/html v10.0.0-beta.31 [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "No changes to commit."
          fi
