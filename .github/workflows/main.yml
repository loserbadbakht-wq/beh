name: beh

on:
  workflow_dispatch:          
  push:

permissions:
  contents: write            

jobs:
  build:
    name: Run
    
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download and extract Video.js HTML
        run: |
          set -e
          curl -LO https://github.com/videojs/v10/releases/download/@videojs/html@10.0.0-beta.26/videojs-html-10.0.0-beta.26.zip
          unzip -o videojs-html-10.0.0-beta.26.zip -d public/
          rm videojs-html-10.0.0-beta.26.zip

      - uses: stefanzweifel/git-auto-commit-action@v7   # Using v7 as requested
        with:
          commit_message: Update Video.js HTML to 10.0.0-beta.26
          file_pattern: public/**   # Only track changes inside public/
