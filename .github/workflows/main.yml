name: Self-host Video.js player

on:
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-save @videojs/html esbuild

      - name: Create entry file
        run: |
          cat > player-entry.js << 'EOF'
          import '@videojs/html/video/player';
          import '@videojs/html/video/skin';
          EOF

      - name: Bundle player into public/
        run: |
          mkdir -p public
          npx esbuild player-entry.js \
            --bundle \
            --format=esm \
            --minify \
            --sourcemap \
            --outfile=public/player.js

      - name: Clean up entry file
        run: rm -f player-entry.js

      - name: Commit and push public folder
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'Update self-hosted player bundle'
          file_pattern: 'public/*'
